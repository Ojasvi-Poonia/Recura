[project]
name = "recura"
version = "0.1.0"
description = "Autonomous revenue-recovery agent: EV-driven decisions under a policy contract."
requires-python = ">=3.11"
# Core: what `make eval`, `make validate`, `make ablate`, `make sweep` and `make replay`
# need. Deliberately excludes the LLM SDKs - they are imported lazily and are required
# only to REGENERATE fixtures, never to replay them.
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
llm = ["anthropic>=0.40", "google-genai>=1.0"]        # only for `make fixtures`
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "hypothesis>=6.100"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
