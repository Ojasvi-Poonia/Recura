[project]
name = "recura"
version = "0.1.0"
description = "Autonomous revenue-recovery agent: EV-driven decisions under a policy contract."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
