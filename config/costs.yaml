# Direct cost per action, in integer paise (CLAUDE.md section 5).
# Indian bulk-messaging list prices, 2026. These are order-of-magnitude figures:
# the EV ranking is insensitive to +/-30% here, which is asserted in the sweep.

direct_cost_paise:
  sms: 25            # ~Rs 0.25 per DLT-registered transactional SMS
  whatsapp: 70       # ~Rs 0.70 per business-initiated utility conversation
  email: 2           # ~Rs 0.02 amortised ESP cost
  voice: 300         # ~Rs 3.00 per connected outbound call minute
  retry_attempt: 50  # ~Rs 0.50 gateway processing overhead. NOT zero: a failed debit
                     # also triggers the issuer's own decline SMS to the customer, and
                     # burns one of the NPCI per-day frequency slots. Modelling retries
                     # as free made NO_ACTION unreachable on small tickets.
  escalate_human: 12000  # ~Rs 120: FULLY LOADED cost of one human collections touch.
                         # 10-15 min of an agent's time at an all-in ~Rs 500/hour, not
                         # just wage. Priced at Rs 40 the optimiser correctly found that
                         # escalation was the cheapest strong action available and
                         # escalated ~40% of events - an operational impossibility that
                         # was inflating the headline recovery rate.

# Attention cost rises SUPERLINEARLY with recent contact count.
# This is the term that makes the agent stop on its own (CLAUDE.md section 5).
# No published source exists for the monetary cost of annoying a customer, so this
# is a documented modelling choice and is swept in Tier 3. See eval/CALIBRATION.md section 5.
attention_cost:
  base_paise: 150         # cost of the FIRST contact in a 7-day window
  exponent: 2.1           # cost_n = base * (n+1)^exponent ; n = contacts in last 7d
  opt_out_risk_paise: 250000  # expected lifetime value destroyed by an opt-out

# Gross margin applied to recovered revenue when computing EV.
# 30% is a mid-range figure for subscription/D2C merchants; swept.
margin_bps: 3000
